[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    radio_hardware: requires a physically connected and explicitly authorized radio
    issue46: PlutoSDR refill-continuity reproduction for GitHub issue 46
    tandem_quality: compares manual, AGC, and tandem AGC RF quality on the guarded TX2 fixture
    tandem_transient_transport_probe: qualifies weak-signal tandem metadata transport without running a release transient
