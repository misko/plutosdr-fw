# Immutable source graph for the third opt-in DDR burst candidate.
#
# RC3 retains RC2's qualified userspace, maximum-frame RX DMA geometry, and
# deterministic FPGA fit while fencing the AXI DMAC's asynchronous hardware
# shutdown before a terminated buffer can be reopened.  DDR burst remains
# disabled by default and ordinary IIO buffers keep their existing behavior.

