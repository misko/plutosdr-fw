# Immutable source graph for the DDR burst v2 release candidate.
#
# RC1 keeps the released DDR burst v1 FPGA, Linux, metadata, and gadget graph.
# It advances only libiio and its Buildroot recipe: iiOD reconciles the native
# modulo-256 tandem transition status, rejects unsafe AUTO arm windows before
# acquiring hardware, and retains a cumulative transition count in metadata.
# DDR burst remains disabled by default and ordinary buffers use the same IIO
# data path.

