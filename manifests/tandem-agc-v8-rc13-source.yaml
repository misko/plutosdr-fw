# Immutable source graph for the forward-only tandem AGC v8 RC13 candidate.
# RC13 retains RC12's firmware implementation, external component graph,
# deterministic package, paired 0456:b673,0456:b674 DFU selector, exact-topology
# resolver, per-radio /32 route lease, RAM-only boundary, and safe-state checks.
# RC12 locked exact commit 12261ed055d4488d64aa7ff5353b680a37c3f93d at
# refs/tags/tandem-agc-v8-rc12-source/firmware-v1. Trusted workflow_dispatch run
# 32978460325, attempt 1, retained artifact ID 9611124509 and produced verified
# candidate-index, bundle, DFU, and FIT SHA-256 values
# a339c99eb7d16980b33249d5a8a5e8c0693a4d22cbf6333c5ce0b3aa2b0151cd,
# 789aa4d9e8fc672a2040abeee89a34de5f62dafd9e933628ac09d0aac21444c2,
# 6ffe6ddf898986b1fd6629db796b6b10422a4e5a00da268e0f63d1d258db52a0,
# and 5db1c49f954e630e4d2a41860bc6bf3f1a6e58749c5c382398caa30887781957.
#
# On winbond-db6968136727402c at topology 3-7, RC12's first attempt stopped
# before reboot or DFU because the retained RC1 SSH host key was stale. After
# isolated exact-current key enrollment, the second attempt completed the RAM
# request, paired-selector -D and -e, and returned the exact b673 runtime at the
# same topology running RC12 safely. Postboot and cleanup SSH both exited 255:
# /etc/init.d/S50dropbear starts Dropbear with -R and no persistent host key, so
# each RAM boot generates a new key. The /32 route was removed; no deploy
# receipt, retained deploy log, or retained SSH stderr was produced. No QSPI
# write or persistent target was used. Because no preboot QSPI digest was
# retained, postboot QSPI equality is not claimed. RC12 therefore has one
# observed successful RAM deployment, zero valid receipt-authorized
# deployments, and is not hardware-qualified.
#
# RC13 removes known-hosts inputs from the CLI, plan, and receipt and advances
# the measured RAM-boot receipt schema from v3 to v4. SSH remains password-only
# through sshpass -f, bound to the exact radio interface, with one password
# prompt and the preferred password authentication. Host-key checking is
# deliberately disabled for the ephemeral RAM rootfs with the exact policy
# StrictHostKeyChecking=no, UserKnownHostsFile=/dev/null, and
# GlobalKnownHostsFile=/dev/null; PasswordAuthentication=yes,
# PubkeyAuthentication=no, KbdInteractiveAuthentication=no, CheckHostIP=no,
# and UpdateHostKeys=no remain exact. Serial/topology/runtime binding, paired
# selector use without -S or -R, unchanged-QSPI proof in successful receipts,
# safe-state verification, and guaranteed /32 route cleanup remain mandatory.

