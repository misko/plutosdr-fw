# Immutable source graph for the first opt-in DDR burst candidate.
#
# This graph is forked from the ABI-3 single-RX metadata candidate, itself
# based on tandem AGC v8 RC32. Only libiio/iiOD and the Buildroot pin change.
# HDL, Linux, U-Boot, metadata serialization, and both gadget daemons remain
# source-identical. The candidate is RAM-only until the ordinary-path control,
# burst capture, cancellation, memory-reserve, USB, and IP gates pass.

