# Immutable source graph for the fourth opt-in DDR burst candidate.
#
# RC4 retains RC3's synchronized AXI DMAC shutdown and resets the asynchronous
# RX timestamp FIFO whenever the reconfigurable AD9361 sample clock resets.
# This prevents a completed high-rate capture from starving a later low-rate
# IIO buffer.  DDR burst remains disabled by default and ordinary buffers use
# the same public IIO path.

