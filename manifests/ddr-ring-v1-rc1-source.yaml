# Immutable source graph for the optional DDR ring v1 RC1 candidate.
#
# RC1 is based directly on the released DDR burst v2 / RC32 trajectory. It
# leaves the FPGA, Linux DMA, metadata, USB gadget, direct-IP gadget, and boot
# components unchanged. Only libiio and its Buildroot pin advance. The legacy
# sealed burst remains unchanged; the new ring is separately negotiated,
# disabled by default, bounded to 200,000,000 IQ bytes, and uses whole-frame
# producer/consumer ownership with exact counter-gap failure.

