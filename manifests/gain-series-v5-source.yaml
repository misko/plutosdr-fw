# Source-only manifest for the gain-series v5 candidate: v4's source graph with
# the tandem AGC HDL integration.
#
# Only the hdl pin differs from manifests/gain-series-v4-source.yaml. Everything
# else -- gadget, ip-gadget, buildroot, hdl-quantulum, linux, u-boot-xlnx -- is
# the tree that shipped as v0.38-plutoplus-spf-gain-series-v4, so anything that
# changes between v4 and v5 RC1 in the FPGA is attributable to tandem alone.
#
# Original header follows.
#
# Source-only manifest for the unpromoted gain-series firmware candidate.
# Image identity, release tag, and hashes are added only after Vivado build,
# RAM-boot acceptance, and the two-radio promotion gate.
# Every component ref below is a protected source-lock tag that resolves
# exactly to its adjacent 40-character commit. Development branches may move;
# these source locks must never be updated or deleted.

