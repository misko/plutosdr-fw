# Source-only manifest for the gain-series v5 candidate: v4's source graph with
# the tandem AGC HDL integration.
#
# Three pins differ from manifests/gain-series-v4-source.yaml: hdl carries the
# tandem block, linux carries the driver and device-tree node that make it
# reachable from a host, and buildroot carries the package that puts the
# operator tool in the rootfs. Everything else -- gadget, ip-gadget,
# hdl-quantulum, u-boot-xlnx -- is the tree that shipped as
# v0.38-plutoplus-spf-gain-series-v4, so anything that changes between v4 and
# v5 is attributable to tandem alone.
#
# The runtime source itself is pinned by the buildroot package, not here:
# package/spf_gainctl fetches runtime/ from plutosdr-fw at
# refs/tags/gain-series-v5-rc3-source/runtime, the same way sdr_ip_gadget pins
# its own tree.
#
# Original header follows.
#
# Source-only manifest for the unpromoted gain-series firmware candidate.
# Image identity, release tag, and hashes are added only after Vivado build,
# RAM-boot acceptance, and the two-radio promotion gate.
# Every component ref below is a protected source-lock tag that resolves
# exactly to its adjacent 40-character commit. Development branches may move;
# these source locks must never be updated or deleted.

