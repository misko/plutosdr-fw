# Immutable source graph for the first single-RX metadata candidate.
#
# This graph is forked exactly from tandem AGC v8 RC32. It changes only the
# shared metadata serializer, libiio/iiod, and the Buildroot pins which bind
# those two components. HDL, Linux, U-Boot, and both gadget daemons remain
# byte-for-byte source-identical, while RC32's release and evidence policy is
# retained. The candidate is RAM-only until its RX0, RX1, dual-RX, exact-gap,
# and RC32 regression gates pass.

