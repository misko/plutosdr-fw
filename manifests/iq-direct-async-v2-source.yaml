# Candidate source graph for direct-async IQ v2.
#
# The host supplies one finite direct_async_frames target. On a radio-side
# overrun, drop-backlog mode preserves the in-flight TCP frame, retires every
# queued-but-unsent frame (DMA or RAM), rebases exact V6 gap metadata, and
# refills the same queue to the original host target. Preserve-backlog remains
# explicitly selectable.

