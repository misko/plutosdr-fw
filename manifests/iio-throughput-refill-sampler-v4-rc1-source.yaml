# Immutable source graph for the refill-fenced metadata-sampler prototype.
#
# This candidate retains v3 sample-rate-aware polling, selective iiOD R/W-
# worker affinity, and timing v1. HOLD and AUTO each make one real AD936x
# gain/RSSI observation whose synchronized counter interval brackets a refill.
# Exact intra-frame AUTO gain transitions remain authoritative FPGA events.
# The IIO wire ABI, DDR limits, and failure contracts are unchanged. This
# candidate is never persistence-authorized.

