# Candidate source graph for the owner-scoped persistent-hop provider.
#
# This extends the qualified direct-async v4 graph.  TAG2 ABI v2 exposes the
# existing receive-clock sample counter through a coherent 64-bit status
# snapshot.  The kernel brackets owner-authenticated RX fastlock recalls with
# that counter, and the compile-gated iiOD provider reports the resulting
# transition/restore evidence without synthesizing device time.

