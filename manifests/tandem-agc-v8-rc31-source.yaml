# Immutable source graph for the forward-only tandem AGC v8 RC31 candidate.
# RC30 passed every offline, routed OOC, trusted integrated-build, packaging,
# checksum, and candidate-index gate at commit
# aa9c56c664d5cd5f74d2c70b4e271682593f08a4. Before hardware transition, its
# pinned pluto-plus-utils release inventory correctly failed closed because an
# unrelated ordinary ADALM-Pluto was attached beside the four Pluto+ targets.
# RC31 retains RC30's exact device firmware, external component graph, RF
# policy, and every authorizing oracle. It advances only the host device-tool
# pin to b2b3113c2e8724453179f09d357b4917c0f14c77, whose read-only
# candidate-ram inventory can select one exact serial from a mixed USB scan.
# The full bus is still scanned; absence, duplicate serial, non-Plus selection,
# incomplete topology/network identity, and every later plan/execute mismatch
# fail closed. No RC30 candidate bytes reached hardware. RC31 remains RAM-only
# until the complete four-radio release campaign passes.

