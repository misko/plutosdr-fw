# Immutable source graph for the forward-only tandem AGC v8 RC8 candidate.
# RC8 retains RC7's successful build, fully routed timing-clean image, and
# integrated-report verdict. RC7 was rejected before evidence assembly or
# hardware deployment because bundle member/checksum ordering depended on the
# runner locale and shell array order. External component pins remain
# byte-identical to RC4 through RC7; the separately protected firmware source
# lock binds the final reviewed firmware commit after all candidate tooling and
# offline gates pass.

