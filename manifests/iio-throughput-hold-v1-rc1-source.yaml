# Immutable source graph for the IIO throughput HOLD sampler prototype RC1.
#
# This candidate changes only libiio/iiOD and its Buildroot pin relative to the
# v0.44 DDR ring prefill release. AUTO metadata sampling is unchanged. HOLD
# metadata sampling keeps the same four-point-per-frame design target without
# polling hundreds of unnecessary gain/RSSI observations per second.

