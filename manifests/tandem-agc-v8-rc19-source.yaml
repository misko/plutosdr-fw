# Immutable source graph for the forward-only tandem AGC v8 RC19 candidate.
# RC19 retains RC18's firmware implementation and every external source pin.
# RC18's trusted build, bundle, candidate index, four RAM-only deployments,
# four lifecycle reports, and all final safe-state checks passed.  Its first
# full comparison reached hardware; the steady characterization recorded one
# marginal native-fast-attack quality failure and cleaned up safely.  The
# explicitly authorized retry then stopped before USB because the canonical
# checkpoint writer sorted phase-object keys while the resume loader required
# their iteration order to equal execution order.  RC19 changes only that
# exact-set/spec resume validation and its release lineage.  It remains
# RAM-only and retains every utility serial, topology, route, sealed-input,
# paired-selector, QSPI-equality, safe-state, v5 evidence-frame-schema, and v2
# live-buffer-ABI guard.

