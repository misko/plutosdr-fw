# Immutable source graph for the final tandem AGC v8 build.
#
# The external component graph remains identical from RC4 through RC21, but the
# tracked top-level repository does not. RC5 added post-RC4
# stale-small-ADC-latch recovery; RC6 retained that behavior while sharing the
# mutually exclusive dwell storage behind an explicit qualification-class tag.
# RC7 corrected the integrated report policy, RC8 made the bundle/checksum
# inventories bytewise deterministic, and RC9 removed the host deployer's
# redundant historical-proof input without changing firmware behavior. RC9's
# first live execute then stopped before reboot or DFU because duplicate
# 192.168.2.0/24 routes and password-only factory SSH were not handled by the
# guarded host transport. RC10 added an exact temporary /32 route lease,
# private password-file authentication, and a v3 measured receipt. Its first
# execute transitioned db696 to serial-less 0456:b674 DFU and failed closed
# before any candidate download; exact-topology detach recovered persistent RC1
# safely with no receipt or QSPI write and with the route absent. RC11 permits
# an absent/empty serial only for exact b674 on the pre-attested topology while
# keeping all runtime b673 paths exact-serial. Its first guarded execute then
# exposed a stale dfu-util selector: both the planner and receipt validator used
# only b674 although the trusted DFU suffix identifies b673. dfu-util exited
# before transferring bytes; paired-selector exact-topology detach recovered
# persistent RC1 safely with no receipt, deployment, or QSPI write. RC12 aligned
# both -D and -e with the documented b673,b674 selector, locked exact commit
# 12261ed055d4488d64aa7ff5353b680a37c3f93d, and passed trusted run
# 32978460325. Its second db696 execute completed the paired RAM transition and
# returned exact b673 running RC12, but postboot and cleanup SSH both exited 255:
# the RAM rootfs starts Dropbear with -R and no persistent host key. No deployment
# receipt or retained preboot QSPI digest was published, so RC12 has one observed
# RAM transition but zero valid receipt-authorized deployments and is not
# hardware-qualified. RC13 removes the unsatisfiable known-hosts pin, uses exact
# password-only SSH with all known-hosts files disabled, and versions the measured
# receipt as v4 while retaining serial/topology, isolated /32 route, IIO/model,
# QSPI equality, safe-state, and paired-selector checks. RC14 moved the live
# device transaction and original receipt to exact pluto-plus-utils commit
# 9ef137768d59925acf21d5cd3ff71d1cb523dba7 while retaining every operational
# guard and keeping plutosdr-fw as the release-plan/evidence-policy owner. Its
# trusted build/index passed, but utility preflight exposed global-discovery and
# capability-name defects before reboot or DFU. RC15 pinned that correction and
# passed build/indexing, then failed closed on the real sysfs DFU symlink before
# candidate download. RC16 pinned utility commit
# 2654f34eb909904ec65bc0526e0f8977cb30e2ed with exact symlink resolution and
# completed a safe db696 RAM boot with unchanged QSPI. Its passing receipt was
# rejected because the bridge confused release frame schema v5 with the live
# IIO buffer ABI v2. RC17 kept those contracts separate; its trusted build,
# candidate evidence, four RAM deployments, and four lifecycle reports passed.
# The first full comparison then failed closed before USB because the durable
# host-libiio validator resolved the firmware wrapper beneath the distinct
# libiio repository. RC18 corrected that binding, then passed its trusted build,
# evidence, four RAM deployments, and four lifecycle reports. Its first db696
# full comparison recorded one marginal native-fast-attack cell and cleaned up;
# the authorized retry stopped before USB because canonical JSON sorted phase
# keys while the resume loader required execution order. RC19 corrected that
# comparison, passed its source-locked build, candidate evidence, four RAM-only
# deployments, and four lifecycle reports, then reached the full RF campaign.
# Native fast attack repeatedly measured between -3.00 and -2.47 dBFS with zero
# clipping, strong SNR, and coherent dual-RX capture, so the shared -3.0 dBFS
# amplitude ceiling rejected otherwise valid cells. RC20 retained every firmware
# and external-source byte while fixing only that release oracle. Its trusted
# build, four RAM deployments, and lifecycle checks passed, but its full campaign
# did not qualify: one 2.45-GHz run had weak-rung SNR contamination and two
# 915-MHz runs exposed a settle/measurement-boundary evidence defect. RC21 keeps
# all firmware/external pins, hardens that boundary and failure-IQ evidence,
# qualifies at fixed 1.05/1.55/2.05/5.8-GHz authorizing centers, and records a
# nonauthorizing full 2.45-GHz diagnostic whose safety/integrity failures remain
# fatal. RC21 must pass its source-locked build and full hardware qualification
# before this final graph is used. The subsequent final build may change only
# the top-level release
# identity and packaging, while requiring exact component identities in packed
# /opt/VERSIONS.

