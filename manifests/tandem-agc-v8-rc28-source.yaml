# Immutable source graph for the forward-only tandem AGC v8 RC28 candidate.
# RC28 retains RC27's exact device firmware and external source pins. RC27
# passed its source-locked build, indexed evidence, four exact-serial RAM
# deployments, and four lifecycle reports. The db696 full campaign passed every
# 1.05-GHz steady matrix and then failed the authorizing 1.55-GHz cooldown-0
# matrix because the two-buffer host DMA queue omitted all louder-TX DECREASE
# events. Hidden gap transitions correctly remained unproven even though their
# paired endpoints reconciled. An exact nonauthorizing replay at the same
# frequency, trajectory, thresholds, sample count, and cooldown passed with 16
# DMA buffers: only five frames were missing, and 17 explicit DECREASE plus 16
# explicit INCREASE events proved both directions. RC28 therefore changes only
# the steady quality harness default from 2 to 16 kernel buffers. The 10-dB RF
# threshold and every event/count/continuity, paired-endpoint, identity,
# metadata, evidence, safety, QSPI, fault, FIFO, overflow, and cleanup gate stay
# fail-closed. Exact 1.05/1.55/2.05/5.8-GHz matrices remain authorizing; the full
# 2.45-GHz matrix remains mandatory but RF-quality-only failure is nonbinding.
# RC28 is RAM-only.

