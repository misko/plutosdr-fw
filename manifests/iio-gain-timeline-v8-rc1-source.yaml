# Immutable source graph for the authoritative sample-clock-aligned gain
# timeline.  ABI 4 selects the exact v7 timeline record while the legacy ABI
# and status scalars remain unchanged for older hosts.  FPGA ABI 2 supplies a
# coherent exclusive sample fence, and libiio starts AUTO only after the DMA
# buffer is armed.  The optional DDR ring remains disabled by default and is
# governed by the same fail-closed DMA/timeline ledger as ordinary capture.
# It exposes each committed frame immediately and never imposes a prefill or
# low-water rebuffering phase.
# This RAM-test candidate is never persistence-authorized.

