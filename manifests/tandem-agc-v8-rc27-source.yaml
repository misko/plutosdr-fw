# Immutable source graph for the forward-only tandem AGC v8 RC27 candidate.
# RC27 retains RC26's exact device firmware and external source pins. RC26 passed
# its trusted build, indexed evidence, four exact-serial RAM deployments, and
# four lifecycle reports. The db696 full campaign then stopped twice in the
# 1.05-GHz low-power-16 matrix when the host metadata provider returned ENODATA
# for a post-startup frame with no complete gain/RSSI observation. Both attempts
# retained their failure IQ and cleanup proved TX muted, DDS zero, selectors
# ZERO, tandem IDLE, FIFO/overflow/fault zero. The provider had already consumed
# the omitted frame, so ENODATA was not a controller or RF-quality verdict.
# RC27 boundedly retries metadata-buffer ENODATA under the existing 65-refill
# limit and requires the next accepted frame to expose the omission through the
# unchanged sequence/count continuity oracle. Ordinary IIO ENODATA remains
# fatal; hidden transitions remain unproven settling evidence and cannot prove
# direction. No RF threshold, paired-event, identity, metadata, evidence,
# safety, QSPI, fault, FIFO, overflow, or cleanup gate is relaxed. Exact
# 1.05/1.55/2.05/5.8-GHz matrices remain authorizing; the full 2.45-GHz matrix
# remains mandatory but RF-quality-only failure is nonbinding. RC27 is RAM-only.

