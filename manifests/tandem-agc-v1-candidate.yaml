# Candidate freeze record for tandem AGC v1.
#
# This is NOT a release manifest. It records what was built and verified so a
# release manifest can be written against it once a DFU exists and hardware
# acceptance has run. The existing manifests in this directory are immutable
# records of *deployed* firmware; this one describes a candidate that has never
# been on a radio.
#
# Same flat key: value subset of YAML the other manifests use, so
# scripts/verify_release.sh can read it with coreutils alone.

