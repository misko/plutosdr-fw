# Immutable source graph for the forward-only tandem AGC v8 RC32 candidate.
# RC31 passed its trusted integrated build, candidate indexing, and exact-serial
# RAM deployment/lifecycle on the three currently authorized radios. Its db696
# campaign retry stopped at 4.2 GHz when native fast attack intermittently held
# one chain's gain. Read-only reproductions isolated AD9361 fast-gain lock
# semantics: a 62 dB live-waveform manual seed made the strong-signal attack
# deterministic in ten of ten runs, while post-lock weak recovery remained
# unlock-condition dependent. RC32 retains RC31's exact device firmware,
# external component graph, RF plan, tool pin
# b2b3113c2e8724453179f09d357b4917c0f14c77, and safety policy. It advances
# only the source-locked host evidence policy: fast strong-signal response is
# binding on both receivers and weak recovery is retained diagnostically;
# manual, slow AGC, and tandem retain their binding contracts. Candidate use
# remains RAM-only and topology 3-8 is explicitly outside this campaign.

