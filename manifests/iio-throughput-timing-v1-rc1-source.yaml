# Immutable source graph for the IIO throughput stage-timing prototype.
#
# This candidate retains the HOLD refill-fence behavior from v2 and adds
# aggregate iiOD timing for DMA refill, sampler admission/completion, metadata
# construction, DDR copy, ring waits, and transport. The timing log is
# diagnostic only: the IIO wire format, capture semantics, and persistent QSPI
# image are unchanged.

