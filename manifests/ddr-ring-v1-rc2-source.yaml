# Immutable source graph for the optional DDR ring v1 RC2 candidate.
#
# RC2 changes only libiio/iiOD relative to RC1. Physical wrap qualification
# found that the atomic status reported an inclusive final sample while the
# metadata ABI defines an exclusive boundary. The shared status helper now
# computes that exclusive boundary with overflow checking. FPGA, Linux DMA,
# metadata, USB gadget, direct-IP gadget, and boot components remain unchanged;
# the ring is still opt-in, disabled by default, and bounded to 200,000,000 IQ
# bytes.

