name: Kalman main firmware build

# Security boundary: this workflow never runs for pull requests. Self-hosted
# work is restricted to pushes and manual runs initiated by the repository
# owner; manual runs also require an explicitly allowed source-lock branch.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: >-
          Exact device-fw string to stamp into /opt/VERSIONS, e.g.
          v0.38-plutoplus-spf-gain-series-v4. Protected tandem candidates and
          final-main dispatches require their exact declared identities.
          Ordinary main push builds derive the string from `git describe`; the
          release tag does not exist while a release build runs, so that
          derived value must never authorize publication. RC17 shipped stamped
          rc16-7 for exactly this reason. The build fails if the packaged
          string does not match what is entered here.
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: kalman-main-firmware
  cancel-in-progress: false

jobs:
  build:
    name: build and package on Kalman
    if: >-
      github.actor == 'misko' &&
      ((github.event_name == 'push' &&
        github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' &&
