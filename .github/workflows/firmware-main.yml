name: Kalman main firmware build

# Security boundary: this workflow never runs for pull requests. Self-hosted
# work is restricted to pushes and manual runs initiated by the repository
# owner; manual runs also require an explicitly allowed source-lock branch.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: >-
          Exact device-fw string to stamp into /opt/VERSIONS, e.g.
          v0.38-plutoplus-spf-gain-series-v4. Protected RC5 and final-main
          dispatches require their exact declared identities. Ordinary main
          push builds derive the string from `git describe`; the release tag
          does not exist while a release build runs, so that derived value must
          never authorize publication. RC17 shipped stamped rc16-7 for exactly
          this reason. The build fails if the packaged string does not match
          what is entered here.
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: kalman-main-firmware
  cancel-in-progress: false

jobs:
  build:
    name: build and package on Kalman
    if: >-
      github.actor == 'misko' &&
      ((github.event_name == 'push' &&
        github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/main' ||
         github.ref == 'refs/heads/codex/firmware-v6-rc4-boot-safety' ||
         github.ref == 'refs/heads/codex/firmware-tandem-agc-v8-rc5' ||
         github.ref == 'refs/heads/codex/firmware-tandem-agc-v8-rc4' ||
         github.ref == 'refs/heads/codex/firmware-tandem-agc-v8-rc3' ||
         github.ref == 'refs/heads/codex/firmware-tandem-agc-v8-rc2' ||
         github.ref == 'refs/heads/codex/firmware-tandem-agc-v8-rc1' ||
         github.ref == 'refs/heads/feature/tandem-agc-v2')))
    runs-on: [self-hosted, Linux, X64, kalman, vivado-2022.2, plutosdr-fw]
    timeout-minutes: 240
    env:
      # Main carries the final v8 source graph. Named legacy branches remain
      # usable only for reproducing independently locked candidates.
      SPF_GAIN_SERIES_MANIFEST: >-
        ${{ format('{0}/manifests/{1}', github.workspace,
          github.ref == 'refs/heads/main' &&
          'tandem-agc-v8-source.yaml' ||
          github.ref == 'refs/heads/codex/firmware-tandem-agc-v8-rc5' &&
          'tandem-agc-v8-rc5-source.yaml' ||
          github.ref == 'refs/heads/codex/firmware-tandem-agc-v8-rc4' &&
          'tandem-agc-v8-rc4-source.yaml' ||
          github.ref == 'refs/heads/codex/firmware-tandem-agc-v8-rc3' &&
          'tandem-agc-v8-rc3-source.yaml' ||
          github.ref == 'refs/heads/codex/firmware-tandem-agc-v8-rc2' &&
          'tandem-agc-v8-rc2-source.yaml' ||
          github.ref == 'refs/heads/codex/firmware-tandem-agc-v8-rc1' &&
          'tandem-agc-v8-rc1-source.yaml' ||
          github.ref == 'refs/heads/feature/tandem-agc-v2' &&
          'tandem-agc-v2-source.yaml' ||
          'libiio-frame-metadata-v6-rc4-source.yaml') }}
      SPF_PACKAGE_STEM_PREFIX: >-
        ${{ github.ref == 'refs/heads/main' &&
          'plutoplus-spf-tandem-agc-v8' ||
          github.ref == 'refs/heads/codex/firmware-tandem-agc-v8-rc5' &&
          'plutoplus-spf-tandem-agc-v8-rc5' ||
          github.ref == 'refs/heads/codex/firmware-tandem-agc-v8-rc4' &&
          'plutoplus-spf-tandem-agc-v8-rc4' ||
          github.ref == 'refs/heads/codex/firmware-tandem-agc-v8-rc3' &&
          'plutoplus-spf-tandem-agc-v8-rc3' ||
          github.ref == 'refs/heads/codex/firmware-tandem-agc-v8-rc2' &&
          'plutoplus-spf-tandem-agc-v8-rc2' ||
          github.ref == 'refs/heads/codex/firmware-tandem-agc-v8-rc1' &&
          'plutoplus-spf-tandem-agc-v8-rc1' ||
          github.ref == 'refs/heads/feature/tandem-agc-v2' &&
          'plutoplus-spf-tandem-agc-v2' ||
          'plutoplus-spf-libiio-metadata-v6-rc4' }}
      SPF_RELEASE_STATE: >-
        ${{ github.ref == 'refs/heads/main' &&
          github.event_name == 'workflow_dispatch' && 'final-release' ||
          github.ref == 'refs/heads/main' && 'main-ci' || 'candidate' }}
    outputs:
      artifact-name: ${{ steps.names.outputs.artifact_name }}
      bundle-name: ${{ steps.build.outputs.bundle_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive
          clean: true
          persist-credentials: false

      - name: Reset persistent nested worktrees
        run: |
          git submodule foreach --recursive \
            'git reset --hard && git clean -ffdx'
          git submodule sync --recursive
          git submodule update --init --recursive --force
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Choose immutable artifact names
        id: names
        run: |
          echo "artifact_name=plutoplus-main-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Require the exact protected candidate identity
        if: github.ref == 'refs/heads/codex/firmware-tandem-agc-v8-rc5'
        env:
          REQUESTED_RELEASE_VERSION: ${{ inputs.release_version || '' }}
        run: |
          test "$REQUESTED_RELEASE_VERSION" = \
            'v0.41-plutoplus-spf-tandem-agc-v8-rc5'

      - name: Require the exact final release identity
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main'
        env:
          REQUESTED_RELEASE_VERSION: ${{ inputs.release_version || '' }}
        run: |
          test "$REQUESTED_RELEASE_VERSION" = \
            'v0.41-plutoplus-spf-tandem-agc-v8'

      - name: Build, validate, and package
        id: build
        env:
          # Empty on push builds, which keeps the `git describe` default.
          RELEASE_VERSION: ${{ inputs.release_version || '' }}
          VIVADO_SETTINGS: /opt/Xilinx/Vivado/2022.2/settings64.sh
          BR2_DL_DIR: /opt/actions-runner-plutosdr-fw/cache/buildroot-dl
          BR2_PRIMARY_SITE: https://sources.buildroot.net
          BR2_GNU_MIRROR: https://ftpmirror.gnu.org
          BR2_BACKUP_SITE: https://sources.buildroot.net
        run: |
          artifact_root=$(mktemp -d "$RUNNER_TEMP/plutosdr-fw-main.XXXXXX")
          echo "artifact_root=$artifact_root" >> "$GITHUB_OUTPUT"
          scripts/ci/build_main_firmware.sh "$artifact_root"
          # Reporting only -- must never be what fails an otherwise good build,
          # so tolerate a missing file here. package_main_firmware.sh is what
          # actually enforces the version, and it has already run by this point.
          awk '$1 == "device-fw" {print "packed_version=" $2; exit}' \
            "$artifact_root/packed-VERSIONS.txt" >> "$GITHUB_OUTPUT" || true
          bundle=$(find "$artifact_root" -maxdepth 1 -type f \
            -name "${SPF_PACKAGE_STEM_PREFIX}-*.tar.gz" -print -quit)
          test -n "$bundle"
          {
            echo "artifact_root=$artifact_root"
            echo "bundle_path=$bundle"
            echo "bundle_name=$(basename "$bundle")"
          } >> "$GITHUB_OUTPUT"

      - name: Upload failed-build diagnostics
        if: failure() && steps.build.outputs.artifact_root != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-${{ steps.names.outputs.artifact_name }}
          path: |
            ${{ steps.build.outputs.artifact_root }}/*.log
            ${{ steps.build.outputs.artifact_root }}/*.rpt
            ${{ steps.build.outputs.artifact_root }}/*.jou
            ${{ steps.build.outputs.artifact_root }}/*.tcl
            ${{ steps.build.outputs.artifact_root }}/*diagnostics*.tar.gz
          if-no-files-found: warn
          retention-days: 30

      - name: Upload deployment bundle and verification sidecars
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.names.outputs.artifact_name }}
          path: |
            ${{ steps.build.outputs.bundle_path }}
            ${{ steps.build.outputs.bundle_path }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Record build result
        env:
          PACKED_VERSION: ${{ steps.build.outputs.packed_version }}
        run: |
          {
            echo '## Kalman firmware bundle'
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Bundle: \`${{ steps.build.outputs.bundle_name }}\`"
            echo "- Artifact: [${{ steps.names.outputs.artifact_name }}](${{ steps.upload.outputs.artifact-url }})"
            echo "- device-fw: \`${PACKED_VERSION:-unknown}\`"
            echo '- Status: offline validated; hardware untested'
          } >> "$GITHUB_STEP_SUMMARY"

  attest:
    name: verify and attest deployment bundle
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download the exact Kalman artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: downloaded
      - name: Verify the downloaded bundle
        run: |
          cd downloaded
          checksum=$(find . -maxdepth 1 -type f -name '*.tar.gz.sha256' -print -quit)
          test -n "$checksum"
          sha256sum -c "$checksum"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: downloaded/${{ needs.build.outputs.bundle-name }}
