name: Experimental firmware merge guard

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# pull_request_target is intentional: this policy must come from protected main.
# Never check out or execute code from the pull request in this workflow.
permissions:
  contents: read

jobs:
  guard:
    name: experimental firmware merge guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the protected base policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Prove the protected policy fixtures
        run: scripts/test_firmware_merge_guard.sh

      - name: Fetch and verify the exact untrusted PR object
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          test "$EVENT_NAME" = pull_request_target
          test "$EVENT_REF" = refs/heads/main
          test "$BASE_REF" = main
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git fetch --no-tags --force origin \
            "+refs/heads/main:refs/remotes/experimental-guard/base-main" \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/experimental-guard/pr-head"
          fetched_base=$(git rev-parse refs/remotes/experimental-guard/base-main^{commit})
          fetched_head=$(git rev-parse refs/remotes/experimental-guard/pr-head^{commit})
          test "$fetched_base" = "$BASE_SHA"
          test "$fetched_head" = "$HEAD_SHA"
          scripts/check_firmware_merge_guard.sh \
            "$HEAD_REF" "$GITHUB_WORKSPACE" "$BASE_SHA" "$HEAD_SHA"
